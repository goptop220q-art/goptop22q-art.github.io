<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Генератор паролей</h1>
        
        <div class="input-group">
            <label for="password-length">Длина пароля:</label>
            <input type="number" id="password-length" min="4" max="32" value="12">
        </div>
        
        <button id="generate-button">Сгенерировать пароль</button>
        
        <div class="password-display">
            <p>Ваш пароль: <span id="generated-password">Нажмите кнопку для генерации</span></p>
        </div>
        
        <div class="options">
            <label>
                <input type="checkbox" id="include-uppercase" checked>
                Включать заглавные буквы
            </label>
            <label>
                <input type="checkbox" id="include-lowercase" checked>
                Включать строчные буквы
            </label>
            <label>
                <input type="checkbox" id="include-numbers" checked>
                Включать цифры
            </label>
            <label>
                <input type="checkbox" id="include-symbols">
                Включать символы
            </label>
        </div>
        
        <button id="copy-button">Копировать пароль</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
